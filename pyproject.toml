[project]
name = "boot-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rdndds", email = "rdndds@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "lz4>=4.4.5",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
    "zstandard>=0.25.0",
]

[project.scripts]
boot-parser = "boot_parser:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
